{% extends 'base.html'%}

{%block content%}

<!-- Header-->
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Login Page</h1>
            <p class="lead fw-normal text-white-50 mb-0">Login to your Account</p>
        </div>
    </div>
</header>
<br><br><br>
<div class="container">
    <div class="row">
        <center>
            <div class="col-8">
                <form method="POST" action="{%url 'login'%}">
                    {%  csrf_token %}
                    <div class="form-group">
                        <input type="username" class="form-control" id="exampleInputUsername1" name="username" placeholder="Enter your username">
                    </div>
                    <br><br>
                    <div class="form-group">
                        <input type="password" class="form-control" id="exampleInputPassword1" name="password" placeholder="Enter your password">
                    </div>
                    <br>
                    <button type="submit" class="btn btn-secondary">Submit</button>
                </form>
                <br><br><br>

            </div>
        </center>
    </div>
</div>
<br><br>

{%endblock%}
